<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westeros — Live Agent World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#e9dcc0; --muted:#a8977a; --panel:#17130f; --panel2:#201a14; --line:#3a2f23; --gold:#d9b25f; --blood:#b3332b; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0907;color:var(--ink);font-family:"VT323",ui-monospace,monospace;font-size:18px}
  #app{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100vh;gap:0}
  header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--line);background:linear-gradient(#1a140f,#110d0a)}
  h1{font-family:Cinzel,serif;font-weight:700;letter-spacing:.18em;font-size:22px;margin:0;color:var(--gold)}
  .tag{color:var(--muted);font-size:17px}
  .hud{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:20px}
  .pill{padding:1px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel2)}
  .pill.winter{background:#2c4660;border-color:#5b7fa6;color:#eaf4ff}
  #stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b0907;overflow:hidden}
  #cv{display:block;max-width:100%;max-height:100%;cursor:crosshair}
  aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .box{padding:10px 12px;border-bottom:1px solid var(--line)}
  .box h2{margin:0 0 6px;font-family:Cinzel,serif;font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:500}
  .ctrls{display:flex;flex-wrap:wrap;gap:6px}
  button{font-family:inherit;font-size:18px;background:#2a2119;color:var(--ink);border:1px solid #4a3c2c;border-radius:3px;padding:2px 10px;cursor:pointer}
  button:hover{background:#3a2e22} button.on{background:var(--gold);color:#1a130c;border-color:var(--gold)}
  button:disabled{opacity:.45;cursor:default}
  #mode{margin-top:6px;color:var(--muted);font-size:16px}
  #flist{overflow:auto;max-height:38vh}
  .fr{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:center;padding:1px 0}
  .fr img{width:18px;height:24px;image-rendering:pixelated}
  .fr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fr .v{color:var(--muted);text-align:right;min-width:48px}
  .fr.dead{opacity:.35;text-decoration:line-through}
  .sw{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:1px}
  #ticker{flex:1;overflow:auto;padding:8px 12px;font-size:17px;line-height:1.2}
  #ticker div{padding:2px 0;border-bottom:1px dotted #2c241b}
  #ticker .t{color:#7d6d55;margin-right:6px}
  #ticker .major{color:var(--gold)} #ticker .blood{color:#ff7a6b} #ticker .ice{color:#9cc8ff}
  #banner{position:absolute;top:7%;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;
          font-family:Cinzel,serif;font-weight:700;font-size:clamp(18px,2.6vw,34px);letter-spacing:.08em;color:#f3e2b8;
          text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.9);opacity:0;transition:opacity .35s}
  #banner small{display:block;font-family:"VT323",monospace;font-size:.6em;letter-spacing:.02em;color:#d8c49a;font-weight:400}
  #tip{position:absolute;pointer-events:none;background:rgba(18,14,10,.94);border:1px solid #4a3c2c;padding:6px 9px;font-size:16px;line-height:1.15;display:none;max-width:260px;z-index:3}
  #tip b{font-family:Cinzel,serif;font-size:13px;color:var(--gold)}
  #loading{position:absolute;bottom:12px;left:12px;font-size:16px;color:var(--muted);background:rgba(10,8,6,.8);padding:3px 8px;border:1px solid var(--line)}
  @media (max-width:900px){ #app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto} #stage{height:60vw} aside{border-left:0} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>WESTEROS</h1><span class="tag">a live multi-agent world</span>
    <div class="hud">
      <span id="turn" class="pill">Turn 0</span>
      <span id="season" class="pill">☀ Summer</span>
      <span id="throne" class="pill">♛ —</span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <div id="tip"></div>
    <div id="loading">Loading the live engine…</div>
  </div>
  <aside>
    <div class="box">
      <h2>CONTROLS</h2>
      <div class="ctrls">
        <button id="play">❚❚ Pause</button>
        <button data-sp="0.5">½×</button><button data-sp="1" class="on">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button>
        <button id="new" disabled>⚔ New live chronicle</button>
      </div>
      <div id="mode">Playing a recorded chronicle…</div>
    </div>
    <div class="box">
      <h2>THE GREAT HOUSES &amp; POWERS</h2>
      <div id="flist"></div>
    </div>
    <div id="ticker"></div>
  </aside>
</div>

<script>
const PY_SOURCES = {"westeros/__init__.py":"","westeros/agents/__init__.py":"","westeros/agents/heuristic.py":"\"\"\"Rule-based agents whose behaviour is driven by personality traits\n(aggression, honor, greed, loyalty). They are the baseline population; swap any\nfaction for an RL or LLM agent to study how it fares among them.\"\"\"\nimport random\n\nfrom ..world import FACTIONS, REGIONS, adjacency\nfrom ..engine import SHIPS_PER_TROOPS, RECRUIT_COST, FOOD_PER_TROOP\n\nADJ = adjacency()\n\n\nclass BaseAgent:\n    def __init__(self, fid, seed=0, traits=None):\n        self.fid = fid\n        self.rng = random.Random(f\"{seed}-{fid}\")\n        self.traits = dict(FACTIONS[fid][\"traits\"], **(traits or {}))\n\n    def act(self, obs):\n        raise NotImplementedError\n\n\nclass RandomAgent(BaseAgent):\n    \"\"\"Picks legal-looking actions uniformly. Useful as a null model.\"\"\"\n\n    def act(self, obs):\n        acts = [dict(type=self.rng.choice([\"accept\", \"reject\"]), proposal_id=p[\"id\"]) for p in obs[\"proposals\"]]\n        for r in obs[\"my_regions\"]:\n            if self.rng.random() < 0.5:\n                acts.append(dict(type=\"recruit\", region=r, n=self.rng.randint(0, 300)))\n        for r, info in obs[\"regions\"].items():\n            n = info[\"garrison\"].get(self.fid, 0)\n            if n > 100 and self.rng.random() < 0.3:\n                acts.append(dict(type=\"move\", src=r, dst=self.rng.choice(list(ADJ[r])), n=n // 2))\n        others = [f for f, i in obs[\"factions\"].items() if i[\"alive\"] and f != self.fid]\n        if others and self.rng.random() < 0.2:\n            acts.append(dict(type=self.rng.choice([\"propose_alliance\", \"break_alliance\"]), to=self.rng.choice(others)))\n        return acts\n\n\nclass HeuristicAgent(BaseAgent):\n    def act(self, obs):\n        T = self.traits\n        acts = []\n        acts += self._answer(obs)\n        k = obs[\"factions\"][self.fid][\"kind\"]\n        if k == \"bank\":\n            return acts + self._bank(obs)\n        if k == \"sellsword\":\n            return acts + self._sellsword(obs)\n        acts += self._economy(obs)\n        acts += self._recruit(obs)\n        acts += self._diplomacy(obs)\n        acts += self._military(obs)\n        return acts[:8]\n\n    # ----------------------------------------------------------- proposals\n    def _answer(self, obs):\n        T, out = self.traits, []\n        F = obs[\"factions\"]\n        for p in obs[\"proposals\"]:\n            a, kind = p[\"from\"], p[\"kind\"]\n            rel = F[a][\"relation\"]\n            ok = False\n            if kind in (\"propose_alliance\", \"propose_marriage\"):\n                bar = 30 - 40 * T[\"loyalty\"] + (25 if kind == \"propose_marriage\" else 0)\n                # shared dread of the dead lowers the bar in winter\n                if obs[\"season\"] == \"winter\" and F.get(\"white_walkers\", {}).get(\"regions\", 0) >= 2:\n                    bar -= 30\n                if self.fid == \"nights_watch\" and a == \"free_folk\" and obs[\"season\"] == \"winter\":\n                    bar = -100   # let them through the Wall\n                ok = rel + F[a][\"reputation\"] / 5 > bar\n            elif kind == \"propose_trade\":\n                give, get = p.get(\"give\", {}), p.get(\"get\", {})\n                value = lambda d: d.get(\"gold\", 0) + d.get(\"food\", 0) * 0.8\n                ok = value(give) >= value(get) * (1.0 + 0.3 * T[\"greed\"]) and rel > -50\n                reserve = {\"food\": obs[\"troops\"] * FOOD_PER_TROOP * 6, \"gold\": 50}\n                ok = ok and all(obs[r] - reserve[r] >= float(v) for r, v in get.items())\n            elif kind == \"lend\":\n                ok = obs[\"gold\"] < 60 and T[\"greed\"] > 0.3\n            out.append(dict(type=\"accept\" if ok else \"reject\", proposal_id=p[\"id\"]))\n        return out\n\n    # ------------------------------------------------------------- economy\n    def _economy(self, obs):\n        T, acts = self.traits, []\n        F = obs[\"factions\"]\n        me_kind = F[self.fid][\"kind\"]\n        upkeep = obs[\"troops\"] * FOOD_PER_TROOP\n        income = sum(obs[\"regions\"][r][\"food\"] * 10 for r in obs[\"my_regions\"])\n        if obs[\"season\"] == \"winter\":\n            income *= 0.5\n        runway = obs[\"food\"] / max(1, upkeep - income) if upkeep > income else 99\n        if runway < 6 and obs[\"gold\"] > 40:\n            # buy grain from whoever has most food and isn't hostile (Tyrells usually)\n            sellers = [f for f, i in F.items() if i[\"alive\"] and f != self.fid and i[\"kind\"] in (\"house\", \"sellsword\")\n                       and i[\"relation\"] > -40 and i[\"food\"] >= 200]\n            if sellers:\n                seller = max(sellers, key=lambda f: F[f][\"food\"] + self.rng.random() * 50)\n                amt = min(obs[\"gold\"] * 0.5, 150)\n                acts.append(dict(type=\"propose_trade\", to=seller, give=dict(gold=round(amt)),\n                                 get=dict(food=round(amt * 0.9))))\n        for l in obs[\"loans\"]:\n            if l[\"due\"] - obs[\"turn\"] <= 2 and obs[\"gold\"] > 0:\n                if T[\"honor\"] > 0.4 or self.fid == \"lannister\":   # a Lannister always pays his debts\n                    acts.append(dict(type=\"repay_loan\", amount=l[\"owed\"]))\n        at_war = any(i[\"relation\"] < -40 and i[\"alive\"] and i[\"kind\"] != \"undead\" for f, i in F.items() if f != self.fid)\n        if (obs[\"gold\"] < 50 and at_war and not obs[\"loans\"] and self.fid not in obs[\"defaulters\"]\n                and self.rng.random() < 0.3 + 0.5 * T[\"greed\"] and F[\"iron_bank\"][\"alive\"]\n                and me_kind in (\"house\", \"horde\")):\n            acts.append(dict(type=\"request_loan\", amount=150))\n        # hire sellswords when rich and threatened\n        if at_war and obs[\"gold\"] > 250 and F.get(\"golden_company\", {}).get(\"alive\") and obs[\"my_regions\"] \\\n                and not any(c[\"hirer\"] == self.fid for c in obs[\"contracts\"]) and self.rng.random() < 0.3:\n            front = max(obs[\"my_regions\"], key=lambda r: self._threat(obs, r))\n            acts.append(dict(type=\"hire\", n=1000, region=front, price=35, turns=6))\n        return acts\n\n    def _recruit(self, obs):\n        T, acts = self.traits, []\n        if obs[\"factions\"][self.fid][\"kind\"] in (\"undead\",):\n            return acts\n        reserve = 40 + 60 * (1 - T[\"aggression\"])\n        budget = max(0.0, obs[\"gold\"] - reserve) if obs[\"factions\"][self.fid][\"kind\"] != \"tribe\" else obs[\"food\"] * 0.4\n        # don't recruit what you can't feed\n        income = sum(obs[\"regions\"][r][\"food\"] * 10 for r in obs[\"my_regions\"])\n        feedable = (income * (0.5 if obs[\"season\"] == \"winter\" else 1) + obs[\"food\"] / 8) / FOOD_PER_TROOP\n        room = max(0, int(feedable - obs[\"troops\"]))\n        regions = sorted(obs[\"my_regions\"], key=lambda r: -self._threat(obs, r))\n        for r in regions:\n            n = int(min(obs[\"regions\"][r][\"levy\"], budget / (RECRUIT_COST * (1.5 if obs[\"factions\"][self.fid][\"kind\"] == \"tribe\" else 1)), room))\n            if n >= 20:\n                acts.append(dict(type=\"recruit\", region=r, n=n))\n                budget -= n * RECRUIT_COST; room -= n\n        return acts\n\n    # ----------------------------------------------------------- diplomacy\n    def _diplomacy(self, obs):\n        T, acts, F = self.traits, [], obs[\"factions\"]\n        me = F[self.fid]\n        if me[\"kind\"] == \"undead\":\n            return acts\n        allies = [f for f, i in F.items() if i[\"allied\"] and i[\"alive\"]]\n        leader = self._leader(obs)\n        cands = [(i[\"relation\"] + i[\"reputation\"] / 4 + (20 if leader and F[leader][\"relation\"] < 0 and f != leader else 0)\n                  - (40 if f == leader else 0), f) for f, i in F.items()\n                 if f != self.fid and i[\"alive\"] and not i[\"allied\"] and i[\"kind\"] not in (\"undead\", \"bank\", \"sellsword\")]\n        cands.sort(reverse=True)\n        if cands and len(allies) < 1 + int(3 * (1 - T[\"aggression\"])) and self.rng.random() < 0.25:\n            score, target = cands[0]\n            if score > 10:\n                kind = \"propose_marriage\" if (score > 55 and self.rng.random() < 0.3) else \"propose_alliance\"\n                acts.append(dict(type=kind, to=target))\n                acts.append(dict(type=\"raven\", to=target,\n                                 text=f\"{FACTIONS[self.fid]['name']} offers friendship. {FACTIONS[self.fid]['motto']}.\"))\n        # sour alliances are abandoned (a prelude to betrayal)\n        for f in allies:\n            if F[f][\"relation\"] < -20 + 30 * (1 - T[\"loyalty\"]) and F[f][\"kind\"] != \"undead\":\n                acts.append(dict(type=\"break_alliance\", to=f))\n        # Free Folk flee south when the dead come\n        if self.fid == \"free_folk\" and obs[\"season\"] == \"winter\" and not F[\"nights_watch\"][\"allied\"] and F[\"nights_watch\"][\"alive\"]:\n            acts.append(dict(type=\"propose_alliance\", to=\"nights_watch\"))\n            acts.append(dict(type=\"raven\", to=\"nights_watch\", text=\"The dead are coming. Open the gate.\"))\n        if self.fid == \"nights_watch\" and obs[\"winter_forecast\"]:\n            acts.append(dict(type=\"raven\", to=\"all\", text=\"Winter is coming and the dead with it. Send men to the Wall.\"))\n        return acts\n\n    # ------------------------------------------------------------ military\n    def _leader(self, obs):\n        \"\"\"Balance of power: a throne-holder who dwarfs the rest becomes everyone's target.\"\"\"\n        F = obs[\"factions\"]\n        if obs[\"turn\"] < 10:   # the King's peace holds for a while\n            return None\n        score = {f: i[\"regions\"] * 10 + i[\"troops\"] / 100 for f, i in F.items()\n                 if i[\"alive\"] and i[\"kind\"] in (\"house\", \"horde\")}\n        if not score:\n            return None\n        top = max(score, key=score.get)\n        rest = sorted(score.values())\n        median = rest[len(rest) // 2]\n        if top != self.fid and (obs[\"iron_throne\"] == top or score[top] > 1.8 * median):\n            return top\n        return None\n\n    def _threat(self, obs, r):\n        t = 0\n        for n in ADJ[r]:\n            o = obs[\"regions\"][n][\"owner\"]\n            if o and o != self.fid and not obs[\"factions\"][o][\"allied\"]:\n                hostility = max(0, -obs[\"factions\"][o][\"relation\"]) / 100 + 0.2\n                t += sum(v for k, v in obs[\"regions\"][n][\"garrison\"].items() if k == o) * hostility\n        return t\n\n    def _military(self, obs):\n        T, acts, F, R = self.traits, [], obs[\"factions\"], obs[\"regions\"]\n        me = F[self.fid]\n        mult = {\"baratheon\": 1.2, \"dothraki\": 1.25, \"white_walkers\": 1.2}.get(self.fid, 1.0)\n        if me[\"kind\"] == \"bank\":\n            return acts\n        if self.fid == \"white_walkers\" and obs[\"season\"] != \"winter\":\n            return acts\n        margin = 1.9 - 0.8 * T[\"aggression\"]\n        war_threshold = -60 + 70 * T[\"aggression\"]   # casus belli: how sour relations must be before war\n        leader = self._leader(obs)\n        options = []\n        for src, info in R.items():\n            mine = info[\"garrison\"].get(self.fid, 0)\n            if mine < 150:\n                continue\n            keep = 0 if self.fid == \"white_walkers\" else int(mine * (0.15 + 0.35 * (1 - T[\"aggression\"])))\n            if self.fid == \"nights_watch\":\n                keep = int(mine * 0.6)\n            avail = mine - keep\n            targets = list(ADJ[src].items())\n            if info[\"owner\"] not in (self.fid, None) and not F[info[\"owner\"]][\"allied\"]:\n                targets.append((src, \"land\"))  # hostile hosts around us\n            for dst, edge in targets:\n                o = R[dst][\"owner\"]\n                if o == self.fid:\n                    continue\n                if edge == \"sea\" and self.fid != \"greyjoy\" and obs[\"ships\"] * SHIPS_PER_TROOPS < avail * 0.5 \\\n                        and not any(F[a][\"allied\"] for a in (\"greyjoy\", \"targaryen\") if a in F):\n                    continue\n                if self.fid == \"nights_watch\" and o not in (None, \"white_walkers\", \"free_folk\"):\n                    continue\n                if dst == \"lands_of_always_winter\" and self.fid != \"white_walkers\":\n                    continue\n                eff_rel = (F[o][\"relation\"] - (50 if o == leader else 0)) if o else 0\n                if o and not F[o][\"allied\"] and eff_rel > war_threshold and self.fid != \"white_walkers\":\n                    continue\n                betray = False\n                if o and F[o][\"allied\"]:\n                    # betrayal: only the faithless, only when the prize is large\n                    if not (T[\"honor\"] < 0.5 and self.rng.random() < (1 - T[\"honor\"]) * T[\"greed\"] * 0.5):\n                        continue\n                    betray = True\n                d = sum(v for k, v in R[dst][\"garrison\"].items() if k == o or k == \"neutral\")\n                d *= R[dst][\"defense\"] * (1.4 if (o == \"martell\" and dst == \"dorne\") else 1.0)\n                if o == \"targaryen\":\n                    d += F[\"targaryen\"][\"dragons\"] * obs[\"dragon_power\"]\n                a = avail * mult + (obs[\"dragons\"] * obs[\"dragon_power\"] if self.fid == \"targaryen\" else 0)\n                if a <= d * margin:\n                    # raid instead if we are raiders and the target is rich\n                    if self.fid in (\"greyjoy\", \"free_folk\", \"dothraki\") and o and not F[o][\"allied\"] and o != \"white_walkers\" \\\n                            and a > d * 0.5 and self.rng.random() < T[\"aggression\"] * 0.5:\n                        options.append((0.5 * (R[dst][\"food\"] + R[dst][\"gold\"]), \"raid\", src, dst, avail, False))\n                    continue\n                value = R[dst][\"food\"] + R[dst][\"gold\"] + (25 if R[dst][\"throne\"] else 0) + 3\n                hate = (-F[o][\"relation\"] / 25) if o else 0\n                if self.fid == \"white_walkers\":\n                    value = 10 + REGIONS[dst][\"y\"] / 50   # the dead march south\n                options.append((value + hate + self.rng.random(), \"move\", src, dst, avail, betray))\n        options.sort(reverse=True)\n        used = set()\n        n_attacks = 1 + int(2 * T[\"aggression\"])\n        for score, kind, src, dst, n, betray in options:\n            if src in used or n_attacks <= 0:\n                continue\n            if betray:\n                acts.append(dict(type=\"break_alliance\", to=R[dst][\"owner\"]))\n            acts.append(dict(type=kind, src=src, dst=dst, n=n))\n            used.add(src); n_attacks -= 1\n        # the Great War: honourable houses send men north when the dead come\n        ww = F.get(\"white_walkers\", {})\n        if obs[\"season\"] == \"winter\" and ww.get(\"alive\") and T[\"honor\"] >= 0.5 and me[\"kind\"] in (\"house\", \"order\"):\n            front = [r for r, i in R.items() if i[\"owner\"] in (\"white_walkers\",)]\n            for src in obs[\"my_regions\"]:\n                if src in used: continue\n                for dst in ADJ[src]:\n                    o = R[dst][\"owner\"]\n                    if o == \"nights_watch\" or (o and F[o][\"allied\"]) or o == self.fid:\n                        if any(n in front for n in ADJ[dst]) or dst == \"the_wall\":\n                            mine = R[src][\"garrison\"].get(self.fid, 0)\n                            if mine > 500 and self.rng.random() < T[\"honor\"] * 0.5:\n                                acts.append(dict(type=\"move\", src=src, dst=dst, n=int(mine * 0.4)))\n                                used.add(src)\n                            break\n        # consolidate: push idle troops from safe interior regions toward the frontier\n        for src in obs[\"my_regions\"]:\n            if src in used:\n                continue\n            mine = R[src][\"garrison\"].get(self.fid, 0)\n            if self._threat(obs, src) == 0 and mine > 400:\n                nbrs = [d for d in ADJ[src] if R[d][\"owner\"] == self.fid and ADJ[src][d] == \"land\"]\n                if nbrs:\n                    dst = max(nbrs, key=lambda d: self._threat(obs, d))\n                    if self._threat(obs, dst) > 0:\n                        acts.append(dict(type=\"move\", src=src, dst=dst, n=int(mine * 0.6)))\n        return acts\n\n    # --------------------------------------------------------- iron bank\n    def _bank(self, obs):\n        acts, F = [], obs[\"factions\"]\n        # punish defaulters by funding their strongest enemy\n        for d in obs[\"defaulters\"]:\n            if not F[d][\"alive\"]:\n                continue\n            enemies = [(i[\"troops\"], f) for f, i in F.items()\n                       if i[\"alive\"] and f not in (d, \"iron_bank\") and i[\"kind\"] == \"house\"\n                       and obs[\"factions\"][f][\"relation\"] >= 0 and self._rel_between_guess(obs, f, d) < 0]\n            if enemies and obs[\"gold\"] > 300 and self.rng.random() < 0.3:\n                acts.append(dict(type=\"fund\", to=max(enemies)[1], amount=150))\n                acts.append(dict(type=\"raven\", to=d, text=\"The Iron Bank will have its due.\"))\n        # offer loans to solvent houses (the bank profits from war)\n        if obs[\"gold\"] > 900 and self.rng.random() < 0.15:\n            houses = [f for f, i in F.items() if i[\"alive\"] and i[\"kind\"] == \"house\" and f not in obs[\"defaulters\"]\n                      and i[\"reputation\"] >= 45]\n            if houses:\n                acts.append(dict(type=\"lend\", to=self.rng.choice(houses), amount=200))\n        return acts\n\n    def _rel_between_guess(self, obs, a, b):\n        # the bank sees public news: who fought whom recently\n        hostile = any(e[\"type\"] == \"battle\" and {e.get(\"attacker\"), e.get(\"defender\")} == {a, b} for e in obs[\"news\"])\n        return -50 if hostile else (-10 if a != b else 0)\n\n    def _sellsword(self, obs):\n        return []  # the Golden Company only answers contracts (see GoldenCompanyAgent._answer)\n\n\nclass IronBankAgent(HeuristicAgent):\n    def _answer(self, obs):\n        out = []\n        for p in obs[\"proposals\"]:\n            ok = False\n            if p[\"kind\"] == \"request_loan\":\n                b = obs[\"factions\"][p[\"from\"]]\n                amt = float(p.get(\"amount\", 0))\n                ok = (p[\"from\"] not in obs[\"defaulters\"] and b[\"reputation\"] >= 35 and b[\"kind\"] in (\"house\", \"horde\", \"sellsword\") and amt <= 400\n                      and obs[\"gold\"] > amt * 1.5 and b[\"regions\"] > 0)\n            out.append(dict(type=\"accept\" if ok else \"reject\", proposal_id=p[\"id\"]))\n        return out\n\n\nclass GoldenCompanyAgent(HeuristicAgent):\n    def _answer(self, obs):\n        out = []\n        for p in obs[\"proposals\"]:\n            ok = False\n            if p[\"kind\"] == \"hire\":\n                n = int(p.get(\"n\", 0))\n                fair = n / 100 * 3 * (0.7 + 0.6 * self.traits[\"greed\"]) * 0.6\n                ok = float(p.get(\"price\", 0)) >= fair and obs[\"troops\"] >= n * 0.5 and obs[\"factions\"][p[\"from\"]][\"relation\"] > -30\n            elif p[\"kind\"] == \"propose_trade\":\n                ok = p.get(\"give\", {}).get(\"gold\", 0) >= p.get(\"get\", {}).get(\"food\", 0) * 1.2 and obs[\"food\"] > 100\n            out.append(dict(type=\"accept\" if ok else \"reject\", proposal_id=p[\"id\"]))\n        return out\n\n\ndef default_agent(fid, seed=0):\n    if fid == \"iron_bank\":\n        return IronBankAgent(fid, seed)\n    if fid == \"golden_company\":\n        return GoldenCompanyAgent(fid, seed)\n    return HeuristicAgent(fid, seed)\n","westeros/engine.py":"\"\"\"WesterosEnv: a turn-based, multi-agent, resource-competition sandbox.\n\nGym/PettingZoo-flavoured API:\n    env = WesterosEnv(seed=0)\n    obs = env.reset()                         # {faction_id: observation}\n    obs, rewards, done, info = env.step({fid: [action, ...]})\n\nEach turn every living faction submits up to MAX_ACTIONS actions (dicts). Proposals made\nthis turn land in the recipient's observation next turn and must be answered with\naccept/reject (unanswered proposals expire). See ACTION_SCHEMA for the full list.\n\"\"\"\nimport math\nimport random\nfrom collections import defaultdict\n\nfrom .world import (REGIONS, FACTIONS, SPECIALS, ALLIED, MARRIED, LORE_RELATIONS,\n                    INCOME_SCALE, adjacency)\n\nMAX_ACTIONS = 8\nFOOD_PER_TROOP = 1 / 60      # food eaten per soldier per turn\nRECRUIT_COST = 0.1           # gold per soldier\nTHRONE_TURNS = 30            # consecutive turns holding King's Landing to win\nLONG_NIGHT_REGIONS = 7       # White Walkers win if they hold this many regions\nTHRONE_MIN_REGIONS = 6       # ...while ruling at least this many regions\nSHIPS_PER_TROOPS = 100       # 1 ship carries 100 soldiers\nLOAN_INTEREST = 0.25\nLOAN_TERM = 10\n\nACTION_SCHEMA = {\n    \"recruit\":         \"{type, region, n}  raise n troops in an owned region (cost 0.1 gold each; free folk pay food)\",\n    \"move\":            \"{type, src, dst, n}  move troops; into a hostile/neutral region = ATTACK. Sea edges need ships (yours + allies')\",\n    \"raid\":            \"{type, src, dst, n}  greyjoy/free_folk/dothraki: hit an adjacent region, steal food+gold, then return\",\n    \"propose_alliance\":\"{type, to}\",\n    \"propose_marriage\":\"{type, to}  stronger alliance; breaking it is a grave betrayal\",\n    \"break_alliance\":  \"{type, to}\",\n    \"propose_trade\":   \"{type, to, give:{gold,food}, get:{gold,food}}\",\n    \"request_loan\":    \"{type, amount}  to the Iron Bank; repay amount*(1+0.25) within 10 turns or default\",\n    \"repay_loan\":      \"{type, amount}\",\n    \"hire\":            \"{type, n, region, price, turns}  hire Golden Company troops into an owned region for price gold/turn\",\n    \"lend\":            \"{type, to, amount}  iron_bank only: unsolicited loan offer (recipient must accept)\",\n    \"fund\":            \"{type, to, amount}  gift gold to another faction (the Iron Bank uses this to punish defaulters)\",\n    \"accept\":          \"{type, proposal_id}\",\n    \"reject\":          \"{type, proposal_id}\",\n    \"raven\":           \"{type, to, text}  free-text message delivered next turn (to may be 'all')\",\n}\n\n\ndef _pair(a, b):\n    return tuple(sorted((a, b)))\n\n\nclass WesterosEnv:\n    def __init__(self, seed=0, max_turns=150, factions=None, fog_of_war=True):\n        self.seed = seed\n        self.max_turns = max_turns\n        self.faction_ids = list(factions or FACTIONS.keys())\n        self.fog_of_war = fog_of_war\n        self.adj = adjacency()\n\n    # ------------------------------------------------------------------ setup\n    def reset(self):\n        self.rng = random.Random(self.seed)\n        self.turn = 0\n        self.owner = {r: None for r in REGIONS}\n        self.garrison = {r: defaultdict(int) for r in REGIONS}\n        self.garrison[\"dragonstone\"][\"neutral\"] = 300\n        self.f = {}\n        for fid in self.faction_ids:\n            d = FACTIONS[fid]\n            self.f[fid] = dict(gold=float(d[\"gold\"]), food=float(d[\"food\"]), ships=d[\"ships\"],\n                               dragons=d[\"dragons\"], alive=True, reputation=50 + 30 * d[\"traits\"][\"honor\"],\n                               eliminated_turn=None, throne_turns=0)\n            per = d[\"troops\"] // len(d[\"regions\"])\n            for r in d[\"regions\"]:\n                self.owner[r] = fid\n                self.garrison[r][fid] += per\n        self.rel = {}\n        for a in self.faction_ids:\n            for b in self.faction_ids:\n                if a < b:\n                    self.rel[(a, b)] = LORE_RELATIONS.get((a, b), LORE_RELATIONS.get((b, a), 0))\n        self.allies = {_pair(a, b) for a, b in ALLIED if a in self.f and b in self.f}\n        self.married = {_pair(a, b) for a, b in MARRIED if a in self.f and b in self.f}\n        self.alliance_start = {p: 0 for p in self.allies}\n        self.loans = []           # {borrower, owed, due}\n        self.contracts = []       # golden company: {hirer, n, price, until, region}\n        self.blacklist = set()\n        self.proposals = {}       # id -> proposal (pending, delivered next turn)\n        self._pid = 0\n        self.ravens = defaultdict(list)\n        self.events = []          # full log\n        self.last_events = []\n        self.season = \"summer\"\n        self.season_left = self.rng.randint(15, 30)\n        self.winner = None\n        self.win_reason = None\n        self._vs_dead = False\n        self.snapshots = [self.snapshot()]\n        return {fid: self.observe(fid) for fid in self.alive()}\n\n    # ---------------------------------------------------------------- helpers\n    def alive(self):\n        return [f for f in self.faction_ids if self.f[f][\"alive\"]]\n\n    def relation(self, a, b):\n        return 0 if a == b else self.rel[_pair(a, b)]\n\n    def shift_rel(self, a, b, d):\n        if a == b or a not in self.f or b not in self.f:\n            return\n        p = _pair(a, b)\n        self.rel[p] = max(-100, min(100, self.rel[p] + d))\n\n    def allied(self, a, b):\n        return _pair(a, b) in self.allies\n\n    def troops(self, fid):\n        return sum(g.get(fid, 0) for g in self.garrison.values())\n\n    def regions_of(self, fid):\n        return [r for r, o in self.owner.items() if o == fid]\n\n    def kind(self, fid):\n        return FACTIONS[fid][\"kind\"]\n\n    def log(self, etype, **kw):\n        e = dict(turn=self.turn, type=etype, **kw)\n        self.events.append(e)\n        self._turn_events.append(e)\n        return e\n\n    def power(self, fid):\n        s = self.f[fid]\n        return (len(self.regions_of(fid)) * 10 + self.troops(fid) / 100 + s[\"gold\"] / 20 + s[\"food\"] / 50\n                + s[\"dragons\"] * 8 + (25 if self.owner[\"crownlands\"] == fid else 0))\n\n    def dragon_power(self):\n        \"\"\"Dragons start young and grow: 100 strength each at turn 0, up to 500 by turn 80.\"\"\"\n        return 100 + min(400, self.turn * 5)\n\n    def ships_available(self, fid):\n        return self.f[fid][\"ships\"] + sum(self.f[o][\"ships\"] for o in self.alive() if o != fid and self.allied(fid, o))\n\n    # ------------------------------------------------------------ observation\n    def observe(self, fid):\n        me = self.f[fid]\n        mine = set(self.regions_of(fid))\n        visible = set(mine)\n        for r in mine:\n            visible |= set(self.adj[r])\n        for r, g in self.garrison.items():\n            if g.get(fid, 0) > 0:\n                visible.add(r); visible |= set(self.adj[r])\n        regions = {}\n        for r, info in REGIONS.items():\n            g = {k: v for k, v in self.garrison[r].items() if v > 0}\n            if self.fog_of_war and r not in visible:\n                g = {k: int(round(v, -3)) for k, v in g.items()}  # rumours only: rounded to 1000s\n            regions[r] = dict(owner=self.owner[r], garrison=g, visible=r in visible or not self.fog_of_war,\n                              food=info[\"food\"], gold=info[\"gold\"], levy=info[\"levy\"], defense=info[\"defense\"],\n                              throne=info.get(\"throne\", False))\n        factions = {}\n        for o in self.faction_ids:\n            t = self.troops(o)\n            factions[o] = dict(alive=self.f[o][\"alive\"], kind=self.kind(o), regions=len(self.regions_of(o)),\n                               troops=t if (o == fid or not self.fog_of_war) else int(round(t, -3)),\n                               food=round(self.f[o][\"food\"], -2 if (self.fog_of_war and o != fid) else 0),\n                               gold=round(self.f[o][\"gold\"], -2 if (self.fog_of_war and o != fid) else 0),\n                               reputation=round(self.f[o][\"reputation\"]), dragons=self.f[o][\"dragons\"],\n                               relation=self.relation(fid, o), allied=self.allied(fid, o),\n                               married=_pair(fid, o) in self.married)\n        props = [p for p in self.proposals.values() if p[\"to\"] == fid]\n        return dict(\n            turn=self.turn, season=self.season,\n            winter_forecast=(self.season == \"summer\" and self.season_left <= 6),\n            me=fid, name=FACTIONS[fid][\"name\"], motto=FACTIONS[fid][\"motto\"], special=SPECIALS[fid],\n            gold=round(me[\"gold\"], 1), food=round(me[\"food\"], 1), ships=me[\"ships\"], dragons=me[\"dragons\"],\n            dragon_power=self.dragon_power(),\n            troops=self.troops(fid), my_regions=sorted(mine), reputation=round(me[\"reputation\"]),\n            loans=[dict(owed=round(l[\"owed\"], 1), due=l[\"due\"]) for l in self.loans if l[\"borrower\"] == fid],\n            contracts=[dict(c) for c in self.contracts if fid in (c[\"hirer\"], \"golden_company\")],\n            iron_throne=self.owner[\"crownlands\"], throne_turns=me[\"throne_turns\"],\n            regions=regions, factions=factions, proposals=props,\n            ravens=list(self.ravens.get(fid, [])),\n            defaulters=sorted(self.blacklist),\n            news=[e for e in self.last_events if e[\"type\"] not in (\"raven\",)][-40:],\n        )\n\n    # ------------------------------------------------------------------- step\n    def step(self, actions):\n        self._turn_events = []\n        self._broken_this_turn, self._broken_married = set(), set()\n        self._dragons_used = False\n        before ={f: self.power(f) for f in self.alive()}\n        actions = {f: list(a or [])[:MAX_ACTIONS] for f, a in actions.items() if f in self.f and self.f[f][\"alive\"]}\n        delivered = self.proposals\n        self.proposals = {}\n        self.ravens = defaultdict(list)\n\n        # 1. answers to last turn's proposals\n        for fid, acts in actions.items():\n            for a in acts:\n                if a.get(\"type\") in (\"accept\", \"reject\"):\n                    p = delivered.get(a.get(\"proposal_id\"))\n                    if p and p[\"to\"] == fid:\n                        self._resolve(p, a[\"type\"] == \"accept\")\n                        p[\"answered\"] = True\n        for p in delivered.values():\n            if not p.get(\"answered\"):\n                self.log(\"proposal_expired\", by=p[\"from\"], to=p[\"to\"], kind=p[\"kind\"])\n\n        # 2. internal + diplomatic actions\n        moves = []\n        for fid, acts in actions.items():\n            for a in acts:\n                t = a.get(\"type\")\n                try:\n                    if t == \"recruit\": self._recruit(fid, a)\n                    elif t in (\"move\", \"raid\"): moves.append((fid, a))\n                    elif t in (\"propose_alliance\", \"propose_marriage\", \"propose_trade\", \"hire\", \"lend\"):\n                        self._propose(fid, a)\n                    elif t == \"request_loan\": self._propose(fid, dict(a, to=\"iron_bank\"))\n                    elif t == \"break_alliance\": self._break(fid, a.get(\"to\"))\n                    elif t == \"repay_loan\": self._repay(fid, float(a.get(\"amount\", 0)))\n                    elif t == \"fund\": self._fund(fid, a)\n                    elif t == \"raven\": self._raven(fid, a)\n                except (KeyError, TypeError, ValueError) as ex:\n                    self.log(\"invalid_action\", by=fid, action=a, error=str(ex))\n\n        # 3. military: peaceful moves first, then attacks/raids in random order\n        self.rng.shuffle(moves)\n        moves.sort(key=lambda m: 0 if self._is_peaceful(m[0], m[1]) else 1)\n        for fid, a in moves:\n            try:\n                self._move(fid, a)\n            except (KeyError, TypeError, ValueError) as ex:\n                self.log(\"invalid_action\", by=fid, action=a, error=str(ex))\n\n        # 4. economy, debts, contracts, the supernatural, seasons\n        self._economy()\n        self._debts_and_contracts()\n        self._supernatural()\n        self._season_tick()\n        self._diplomacy_drift()\n        self._check_elimination()\n        self.turn += 1\n        self._check_victory()\n\n        self.last_events = self._turn_events\n        self.snapshots.append(self.snapshot())\n        done = self.winner is not None or self.turn >= self.max_turns\n        if done and self.winner is None:\n            contenders = [f for f in self.alive() if self.kind(f) in (\"house\", \"horde\", \"tribe\")] or self.alive()\n            best = max(contenders, key=self.power)\n            self.winner, self.win_reason = best, \"most powerful when the chronicle ends\"\n            self.log(\"game_over\", winner=best, reason=self.win_reason)\n        rewards = {f: self.power(f) - before.get(f, 0) for f in self.faction_ids}\n        obs = {f: self.observe(f) for f in self.alive()}\n        return obs, rewards, done, dict(events=self._turn_events, winner=self.winner)\n\n    # ---------------------------------------------------------------- actions\n    def _recruit(self, fid, a):\n        r, n = a[\"region\"], int(a[\"n\"])\n        if self.owner.get(r) != fid or n <= 0 or self.kind(fid) in (\"undead\",):\n            raise ValueError(\"cannot recruit there\")\n        n = min(n, REGIONS[r][\"levy\"])\n        s = self.f[fid]\n        if self.kind(fid) == \"tribe\":\n            n = int(min(n, s[\"food\"] / (RECRUIT_COST * 1.5)))\n            s[\"food\"] -= n * RECRUIT_COST * 1.5\n        else:\n            n = int(min(n, s[\"gold\"] / RECRUIT_COST))\n            s[\"gold\"] -= n * RECRUIT_COST\n        if n > 0:\n            self.garrison[r][fid] += n\n            self.log(\"recruit\", by=fid, region=r, n=n)\n\n    def _propose(self, fid, a):\n        if a[\"type\"] == \"hire\": a = dict(a, to=\"golden_company\")\n        to = a[\"to\"]\n        if to not in self.f or not self.f[to][\"alive\"] or to == fid:\n            raise ValueError(\"bad recipient\")\n        kind = a[\"type\"]\n        if kind == \"lend\" and fid != \"iron_bank\": raise ValueError(\"only the Iron Bank lends\")\n        if kind == \"request_loan\" and fid in self.blacklist: raise ValueError(\"blacklisted by the Iron Bank\")\n        if kind == \"request_loan\" and self.kind(fid) not in (\"house\", \"sellsword\", \"horde\"):\n            raise ValueError(\"the Iron Bank does not lend to the likes of you\")\n        self._pid += 1\n        pid = f\"p{self._pid}\"\n        p = dict(id=pid, kind=kind, **{\"from\": fid}, to=to,\n                 **{k: v for k, v in a.items() if k not in (\"type\", \"to\")})\n        self.proposals[pid] = p\n        self.log(\"proposal\", by=fid, to=to, kind=kind, id=pid,\n                 detail={k: v for k, v in p.items() if k not in (\"id\", \"kind\", \"from\", \"to\")})\n\n    def _resolve(self, p, ok):\n        a, b, k = p[\"from\"], p[\"to\"], p[\"kind\"]\n        if not (self.f[a][\"alive\"] and self.f[b][\"alive\"]):\n            return\n        self.log(\"accepted\" if ok else \"rejected\", by=b, to=a, kind=k, id=p[\"id\"])\n        if not ok:\n            self.shift_rel(a, b, -3)\n            return\n        if k in (\"propose_alliance\", \"propose_marriage\"):\n            if self.kind(a) == \"undead\" or self.kind(b) == \"undead\":\n                return\n            wed = k == \"propose_marriage\" and _pair(a, b) not in self.married\n            if self.allied(a, b) and not wed:\n                return\n            if not self.allied(a, b):\n                self.allies.add(_pair(a, b)); self.alliance_start[_pair(a, b)] = self.turn\n            self.shift_rel(a, b, 15)\n            if wed:\n                self.married.add(_pair(a, b)); self.shift_rel(a, b, 20)\n            self.log(\"alliance_formed\", a=a, b=b, marriage=wed)\n        elif k == \"propose_trade\":\n            give, get = p.get(\"give\", {}), p.get(\"get\", {})\n            if all(self.f[a][r] >= float(v) for r, v in give.items()) and \\\n               all(self.f[b][r] >= float(v) for r, v in get.items()):\n                for r, v in give.items(): self.f[a][r] -= float(v); self.f[b][r] += float(v)\n                for r, v in get.items(): self.f[b][r] -= float(v); self.f[a][r] += float(v)\n                self.shift_rel(a, b, 5)\n                self.log(\"trade\", a=a, b=b, give=give, get=get)\n            else:\n                self.log(\"trade_failed\", a=a, b=b, reason=\"insufficient resources\")\n        elif k == \"request_loan\":\n            amt = float(p.get(\"amount\", 0))\n            if 0 < amt <= self.f[\"iron_bank\"][\"gold\"]:\n                self._make_loan(a, amt)\n        elif k == \"lend\":  # iron bank offered, recipient accepted\n            amt = float(p.get(\"amount\", 0))\n            if 0 < amt <= self.f[\"iron_bank\"][\"gold\"]:\n                self._make_loan(b, amt)\n        elif k == \"hire\":\n            n, price, turns, region = int(p[\"n\"]), float(p[\"price\"]), int(p.get(\"turns\", 5)), p[\"region\"]\n            n = min(n, self.troops(\"golden_company\"))\n            if n > 0 and self.owner.get(region) == a:\n                self._take_troops(\"golden_company\", n)\n                self.garrison[region][a] += n\n                self.contracts.append(dict(hirer=a, n=n, price=price, until=self.turn + turns, region=region))\n                self.log(\"sellswords_hired\", hirer=a, n=n, price=price, turns=turns, region=region)\n\n    def _make_loan(self, borrower, amt):\n        self.f[\"iron_bank\"][\"gold\"] -= amt\n        self.f[borrower][\"gold\"] += amt\n        self.loans.append(dict(borrower=borrower, owed=amt * (1 + LOAN_INTEREST), due=self.turn + LOAN_TERM))\n        self.log(\"loan\", borrower=borrower, amount=amt, due=self.turn + LOAN_TERM)\n\n    def _break(self, fid, to):\n        p = _pair(fid, to)\n        if p in self.allies:\n            self.allies.discard(p)\n            wed = p in self.married\n            self.married.discard(p)\n            self._broken_this_turn.add((fid, to))\n            if wed: self._broken_married.add((fid, to))\n            self.shift_rel(fid, to, -40 if wed else -25)\n            self.f[fid][\"reputation\"] -= 10 if wed else 5\n            self.log(\"alliance_broken\", by=fid, to=to, marriage=wed,\n                     duration=self.turn - self.alliance_start.get(p, 0))\n\n    def _repay(self, fid, amt):\n        for l in self.loans:\n            if l[\"borrower\"] == fid and amt > 0:\n                pay = min(amt, l[\"owed\"], self.f[fid][\"gold\"])\n                l[\"owed\"] -= pay; amt -= pay\n                self.f[fid][\"gold\"] -= pay; self.f[\"iron_bank\"][\"gold\"] += pay\n                if pay > 0: self.log(\"repayment\", by=fid, amount=round(pay, 1))\n        self.loans = [l for l in self.loans if l[\"owed\"] > 0.01]\n\n    def _fund(self, fid, a):\n        to, amt = a[\"to\"], float(a[\"amount\"])\n        amt = min(amt, self.f[fid][\"gold\"])\n        if to in self.f and self.f[to][\"alive\"] and amt > 0 and to != fid:\n            self.f[fid][\"gold\"] -= amt; self.f[to][\"gold\"] += amt\n            self.shift_rel(fid, to, 8)\n            self.log(\"funding\", by=fid, to=to, amount=round(amt, 1))\n\n    def _raven(self, fid, a):\n        text = str(a.get(\"text\", \"\"))[:500]\n        targets = self.alive() if a.get(\"to\") == \"all\" else [a[\"to\"]]\n        for t in targets:\n            if t != fid and t in self.f:\n                self.ravens[t].append(dict(**{\"from\": fid}, text=text))\n        self.log(\"raven\", by=fid, to=a.get(\"to\"), text=text)\n\n    # --------------------------------------------------------------- military\n    def _is_peaceful(self, fid, a):\n        o = self.owner.get(a.get(\"dst\"))\n        return a.get(\"type\") == \"move\" and (o == fid or (o is not None and self.allied(fid, o)))\n\n    def _take_troops(self, fid, n):\n        \"\"\"Remove n troops of fid from wherever they are (largest garrisons first).\"\"\"\n        for r in sorted(REGIONS, key=lambda r: -self.garrison[r].get(fid, 0)):\n            take = min(n, self.garrison[r].get(fid, 0))\n            self.garrison[r][fid] -= take; n -= take\n            if n <= 0: break\n\n    def _strength_mult(self, fid, attacking, region, by_sea):\n        m = 1.0\n        if fid == \"baratheon\": m *= 1.2\n        if fid == \"greyjoy\" and attacking and by_sea: m *= 1.15\n        if fid == \"dothraki\" and attacking and REGIONS[region][\"defense\"] < 1.5: m *= 1.3\n        if fid == \"martell\" and not attacking and region == \"dorne\": m *= 1.4\n        if fid == \"white_walkers\" and self.season == \"winter\": m *= 1.2\n        if fid in (\"stark\", \"nights_watch\") and self._vs_dead: m *= 1.5   # dragonglass & Valyrian steel\n        if attacking and by_sea and fid not in (\"greyjoy\",): m *= 0.8   # amphibious landings are hard\n        return m\n\n    def _move(self, fid, a):\n        src, dst, n = a[\"src\"], a[\"dst\"], int(a[\"n\"])\n        # src == dst: turn on the hosts whose region your troops are standing in (a Red Wedding)\n        edge = \"land\" if (src == dst and self.owner[dst] != fid) else self.adj[src].get(dst)\n        have = self.garrison[src].get(fid, 0)\n        n = min(n, have)\n        if edge is None or n <= 0:\n            raise ValueError(f\"illegal move {src}->{dst}\")\n        if edge == \"sea\" and fid != \"white_walkers\":\n            if self.ships_available(fid) * SHIPS_PER_TROOPS < n:\n                n = self.ships_available(fid) * SHIPS_PER_TROOPS\n                if n <= 0: raise ValueError(\"no ships for sea crossing\")\n        if fid == \"white_walkers\" and edge == \"sea\":\n            raise ValueError(\"the dead do not sail\")\n        o = self.owner[dst]\n        if a[\"type\"] == \"raid\":\n            return self._raid(fid, src, dst, n, edge)\n        if o == fid or (o is not None and self.allied(fid, o)):\n            self.garrison[src][fid] -= n\n            self.garrison[dst][fid] += n\n            self.log(\"move\", by=fid, src=src, dst=dst, n=n, by_sea=edge == \"sea\")\n            return\n        # ---- attack\n        if self.kind(fid) in (\"bank\",):\n            raise ValueError(\"the Iron Bank does not march\")\n        if fid == \"nights_watch\" and o not in (None, \"free_folk\", \"white_walkers\"):\n            raise ValueError(\"the Night's Watch takes no part in the wars of the realm\")\n        if fid == \"white_walkers\" and self.season != \"winter\":\n            raise ValueError(\"the dead only march in winter\")\n        if dst == \"lands_of_always_winter\" and fid != \"white_walkers\":\n            raise ValueError(\"no living army survives the Lands of Always Winter\")\n        self._battle(fid, src, dst, n, edge)\n\n    def _battle(self, fid, src, dst, n, edge):\n        o = self.owner[dst]\n        defenders = {k: v for k, v in self.garrison[dst].items() if v > 0 and k != fid and\n                     (k == o or k == \"neutral\" or (o is not None and k in self.f and self.allied(k, o)))}\n        if o in self.f and (fid, o) in self._broken_this_turn:\n            wed = (fid, o) in self._broken_married\n            self.f[fid][\"reputation\"] -= 15\n            for other in self.alive():\n                if other not in (fid, o): self.shift_rel(fid, other, -8)\n            self.log(\"red_wedding\" if wed else \"betrayal\", by=fid, victim=o, region=dst)\n        self._vs_dead = \"white_walkers\" in (fid, o)\n        att = n * self._strength_mult(fid, True, dst, edge == \"sea\") * self.rng.uniform(0.8, 1.2)\n        fire = 2 if self._vs_dead else 1   # dragonfire burns the dead\n        dragons_here = 0\n        if \"targaryen\" in (fid, o) and not self._dragons_used:   # dragons fight one battle per turn\n            dragons_here = self.f[\"targaryen\"][\"dragons\"]\n            if dragons_here: self._dragons_used = True\n        if fid == \"targaryen\": att += dragons_here * self.dragon_power() * fire\n        d_raw = sum(defenders.values())\n        dfn = sum(v * (self._strength_mult(k, False, dst, False) if k in self.f else 1.0)\n                  for k, v in defenders.items()) * REGIONS[dst][\"defense\"] * self.rng.uniform(0.8, 1.2)\n        if o == \"targaryen\": dfn += dragons_here * self.dragon_power() * fire\n        ratio = att / max(1e-6, att + dfn)\n        att_loss = int(n * (1 - ratio) * 0.7)\n        def_loss_frac = ratio * 0.7\n        win = att > dfn\n        dragons_lost = 0\n        if dragons_here:\n            enemy_strength = dfn if fid == \"targaryen\" else att\n            for _ in range(dragons_here):\n                if self.rng.random() < min(0.35, 0.04 * enemy_strength / 3000):\n                    dragons_lost += 1\n            self.f[\"targaryen\"][\"dragons\"] -= dragons_lost\n        survivors = n - att_loss\n        self.garrison[src][fid] -= n\n        def_losses = {}\n        for k, v in defenders.items():\n            lost = v if win else int(v * def_loss_frac)   # on defeat the garrison is slain or scattered\n            def_losses[k] = lost\n            self.garrison[dst][k] -= lost\n        if win:\n            self.owner[dst] = fid\n            self.garrison[dst][fid] += survivors\n        else:\n            self.garrison[src][fid] += survivors\n        if fid == \"white_walkers\":  # the dead rise\n            raised = int(sum(def_losses.values()) * 0.5)\n            self.garrison[dst if win else src][\"white_walkers\"] += raised\n        if o in self.f:\n            self.shift_rel(fid, o, -35)\n            for other in self.alive():\n                if other not in (fid, o) and self.allied(other, o):\n                    self.shift_rel(fid, other, -10)\n        self.log(\"battle\", attacker=fid, defender=o or \"neutral\", region=dst, src=src, troops=n,\n                 defenders=d_raw, attacker_won=win, attacker_losses=att_loss,\n                 defender_losses=sum(def_losses.values()), dragons_lost=dragons_lost,\n                 by_sea=edge == \"sea\", conquered=win)\n        if win and dst == \"crownlands\":\n            self.log(\"throne_seized\", by=fid, previous=o)\n\n    def _raid(self, fid, src, dst, n, edge):\n        if fid not in (\"greyjoy\", \"free_folk\", \"dothraki\"):\n            raise ValueError(\"only reavers, wildlings and horse lords raid\")\n        o = self.owner[dst]\n        if o is None or o == fid or self.allied(fid, o):\n            raise ValueError(\"nothing to raid\")\n        local = sum(v for k, v in self.garrison[dst].items() if k == o)\n        self._vs_dead = \"white_walkers\" in (fid, o)\n        att = n * self._strength_mult(fid, True, dst, edge == \"sea\") * self.rng.uniform(0.7, 1.3)\n        dfn = local * 0.6 * self.rng.uniform(0.7, 1.3)   # raids hit before defenders can concentrate\n        ratio = att / max(1e-6, att + dfn)\n        loss = int(n * (1 - ratio) * 0.4)\n        self.garrison[src][fid] -= loss\n        self.garrison[dst][o] = max(0, local - int(local * ratio * 0.15))\n        stolen_food = stolen_gold = 0.0\n        if att > dfn:\n            stolen_food = min(self.f[o][\"food\"], REGIONS[dst][\"food\"] * INCOME_SCALE * 1.5)\n            stolen_gold = min(self.f[o][\"gold\"], REGIONS[dst][\"gold\"] * INCOME_SCALE * 1.5)\n            self.f[o][\"food\"] -= stolen_food; self.f[fid][\"food\"] += stolen_food\n            self.f[o][\"gold\"] -= stolen_gold; self.f[fid][\"gold\"] += stolen_gold\n        self.shift_rel(fid, o, -20)\n        self.log(\"raid\", by=fid, target=o, region=dst, src=src, troops=n, by_sea=edge == \"sea\", success=att > dfn, losses=loss,\n                 food=round(stolen_food, 1), gold=round(stolen_gold, 1))\n\n    # ---------------------------------------------------------------- economy\n    def _economy(self):\n        winter = self.season == \"winter\"\n        for fid in self.alive():\n            s = self.f[fid]\n            if self.kind(fid) == \"undead\":\n                continue\n            food = gold = 0.0\n            for r in self.regions_of(fid):\n                R = REGIONS[r]\n                fm = (0.35 if R[\"y\"] < 420 else 0.65) if winter else 1.0\n                food += R[\"food\"] * INCOME_SCALE * fm\n                gold += R[\"gold\"] * INCOME_SCALE\n            if fid == \"lannister\": gold *= 1.5\n            if fid == \"tyrell\": food *= 1.3\n            if fid == \"tully\": food *= 1.2\n            if self.owner[\"crownlands\"] == fid: gold += 30   # crown taxes\n            if fid == \"iron_bank\": gold += 20                # interest on the world\n            upkeep = self.troops(fid) * FOOD_PER_TROOP * (0.5 if fid == \"stark\" and winter else 1.0)\n            s[\"food\"] += food - upkeep\n            s[\"gold\"] += gold\n            if fid == \"nights_watch\":\n                self.garrison[\"the_wall\"][\"nights_watch\"] += 40 if self.owner[\"the_wall\"] == \"nights_watch\" else 0\n            if s[\"food\"] < 0:  # starvation: desertion\n                deserters = int(self.troops(fid) * 0.12)\n                self._take_troops(fid, deserters)\n                self.log(\"starvation\", faction=fid, deserters=deserters)\n                s[\"food\"] = 0.0\n\n    def _debts_and_contracts(self):\n        keep = []\n        for l in self.loans:\n            if self.turn >= l[\"due\"]:\n                b = self.f[l[\"borrower\"]]\n                pay = min(b[\"gold\"], l[\"owed\"])\n                b[\"gold\"] -= pay; self.f[\"iron_bank\"][\"gold\"] += pay; l[\"owed\"] -= pay\n                if l[\"owed\"] > 0.01:\n                    self.blacklist.add(l[\"borrower\"])\n                    self.f[l[\"borrower\"]][\"reputation\"] -= 10\n                    self.shift_rel(\"iron_bank\", l[\"borrower\"], -50)\n                    self.log(\"default\", borrower=l[\"borrower\"], unpaid=round(l[\"owed\"], 1))\n                else:\n                    self.log(\"loan_repaid\", borrower=l[\"borrower\"])\n            else:\n                keep.append(l)\n        self.loans = keep\n        keep = []\n        for c in self.contracts:\n            h = c[\"hirer\"]\n            if not self.f[h][\"alive\"]:\n                continue\n            if self.turn >= c[\"until\"] or self.f[h][\"gold\"] < c[\"price\"]:\n                n = min(c[\"n\"], self.troops(h))\n                self._take_troops(h, n)\n                self.garrison[self.regions_of(\"golden_company\")[0] if self.regions_of(\"golden_company\") else \"free_cities\"][\"golden_company\"] += n\n                broke = self.turn < c[\"until\"]\n                if broke: self.shift_rel(h, \"golden_company\", -20)\n                self.log(\"contract_ended\", hirer=h, n=n, unpaid=broke)\n            else:\n                self.f[h][\"gold\"] -= c[\"price\"]; self.f[\"golden_company\"][\"gold\"] += c[\"price\"]\n                keep.append(c)\n        self.contracts = keep\n\n    def _supernatural(self):\n        if \"white_walkers\" not in self.f or not self.f[\"white_walkers\"][\"alive\"]:\n            return\n        for r in self.regions_of(\"white_walkers\"):\n            g = self.garrison[r]\n            if self.season == \"winter\":\n                g[\"white_walkers\"] += int(g[\"white_walkers\"] * 0.05) + 40\n            elif r == \"lands_of_always_winter\":\n                g[\"white_walkers\"] += 15\n            else:  # summer sun: the dead wither south of the Wall\n                lost = int(g[\"white_walkers\"] * 0.15)\n                g[\"white_walkers\"] -= lost\n                if g[\"white_walkers\"] <= 50:\n                    g[\"white_walkers\"] = 0\n                    self.owner[r] = None\n                    self.log(\"dead_retreat\", region=r)\n\n    def _season_tick(self):\n        self.season_left -= 1\n        if self.season_left <= 0:\n            self.season = \"winter\" if self.season == \"summer\" else \"summer\"\n            self.season_left = self.rng.randint(15, 25) if self.season == \"winter\" else self.rng.randint(25, 40)\n            self.log(\"season\", season=self.season,\n                     text=\"Winter has come.\" if self.season == \"winter\" else \"Spring returns to Westeros.\")\n\n    def _diplomacy_drift(self):\n        for a, b in list(self.allies):\n            self.shift_rel(a, b, 1)\n        # a common enemy at the Wall slowly brings the living together in winter\n        if self.season == \"winter\" and self.owner[\"the_wall\"] == \"white_walkers\":\n            living = [f for f in self.alive() if f != \"white_walkers\"]\n            for i, a in enumerate(living):\n                for b in living[i + 1:]:\n                    self.shift_rel(a, b, 1)\n        # whoever sits the Iron Throne is envied by everyone else\n        holder = self.owner[\"crownlands\"]\n        if holder in self.f:\n            for o in self.alive():\n                if o != holder and not self.allied(o, holder) and self.kind(o) == \"house\":\n                    self.shift_rel(o, holder, -2)\n        # border incidents: neighbours with different lords grate on each other\n        borders = {_pair(self.owner[a], self.owner[b]) for a in REGIONS for b in self.adj[a]\n                   if self.owner[a] in self.f and self.owner[b] in self.f and self.owner[a] != self.owner[b]\n                   and self.kind(self.owner[a]) in (\"house\", \"horde\", \"tribe\", \"order\")\n                   and self.kind(self.owner[b]) in (\"house\", \"horde\", \"tribe\", \"order\")}\n        for a, b in sorted(borders):\n            if self.rng.random() < 0.10:\n                d = -self.rng.randint(5, 20)\n                self.shift_rel(a, b, d)\n                self.log(\"border_incident\", a=a, b=b, delta=d)\n        for fid in self.alive():\n            s = self.f[fid]\n            target = 50 + 30 * FACTIONS[fid][\"traits\"][\"honor\"]\n            s[\"reputation\"] += (target - s[\"reputation\"]) * 0.02\n\n    def _check_elimination(self):\n        for fid in self.alive():\n            if not self.regions_of(fid) and self.troops(fid) <= 0:\n                self.f[fid][\"alive\"] = False\n                self.f[fid][\"eliminated_turn\"] = self.turn\n                self.allies = {p for p in self.allies if fid not in p}\n                self.log(\"eliminated\", faction=fid)\n            elif not self.regions_of(fid) and self.kind(fid) not in (\"undead\",):\n                # landless remnants wander; they starve faster\n                pass\n        for r, g in self.garrison.items():\n            for k in list(g):\n                if g[k] <= 0: del g[k]\n\n    def _check_victory(self):\n        holder = self.owner[\"crownlands\"]\n        for fid in self.alive():\n            self.f[fid][\"throne_turns\"] = self.f[fid][\"throne_turns\"] + 1 if holder == fid else 0\n        if holder and self.kind(holder) == \"house\" and len(self.regions_of(holder)) < THRONE_MIN_REGIONS:\n            self.f[holder][\"throne_turns\"] = 0   # a king who rules only his city is no king\n        if holder and self.kind(holder) == \"house\" and self.f[holder][\"throne_turns\"] >= THRONE_TURNS:\n            self.winner, self.win_reason = holder, f\"ruled the Seven Kingdoms from the Iron Throne for {THRONE_TURNS} turns\"\n        if \"white_walkers\" in self.f and len(self.regions_of(\"white_walkers\")) >= LONG_NIGHT_REGIONS:\n            self.winner, self.win_reason = \"white_walkers\", \"the Long Night has fallen\"\n        if self.winner:\n            self.log(\"game_over\", winner=self.winner, reason=self.win_reason)\n\n    # --------------------------------------------------------------- logging\n    def snapshot(self):\n        return dict(\n            turn=self.turn, season=self.season,\n            owner=dict(self.owner),\n            garrison={r: {k: v for k, v in g.items() if v > 0} for r, g in self.garrison.items()},\n            factions={f: dict(alive=s[\"alive\"], gold=round(s[\"gold\"], 1), food=round(s[\"food\"], 1),\n                              troops=self.troops(f), regions=len(self.regions_of(f)), dragons=s[\"dragons\"],\n                              reputation=round(s[\"reputation\"], 1), power=round(self.power(f), 1))\n                      for f, s in self.f.items()},\n            allies=sorted(list(p) for p in self.allies),\n            married=sorted(list(p) for p in self.married),\n            relations={f\"{a}|{b}\": v for (a, b), v in self.rel.items()},\n            events=list(getattr(self, \"_turn_events\", [])),\n        )\n","westeros/live.py":"\"\"\"Step-by-step session used by the live browser world (via Pyodide) and the site builder.\n\nEach step returns a compact JSON-able frame: the state after the turn plus the events\nthat produced it, which the pixel map animates.\"\"\"\nimport json\n\nfrom .engine import WesterosEnv\nfrom .agents.heuristic import default_agent\n\nKEEP = {\"move\", \"battle\", \"raid\", \"recruit\", \"alliance_formed\", \"alliance_broken\", \"betrayal\", \"red_wedding\",\n        \"throne_seized\", \"eliminated\", \"season\", \"trade\", \"loan\", \"default\", \"sellswords_hired\", \"funding\",\n        \"starvation\", \"dead_retreat\", \"game_over\", \"raven\", \"contract_ended\", \"loan_repaid\"}\n\n\ndef frame(env, snap, done=False):\n    return dict(\n        turn=snap[\"turn\"], season=snap[\"season\"], owner=snap[\"owner\"], garrison=snap[\"garrison\"],\n        factions={f: {k: s[k] for k in (\"alive\", \"troops\", \"regions\", \"gold\", \"food\", \"dragons\", \"power\")}\n                  for f, s in snap[\"factions\"].items()},\n        allies=snap[\"allies\"], married=snap[\"married\"],\n        events=[e for e in snap[\"events\"] if e[\"type\"] in KEEP],\n        done=done, winner=env.winner if done else None, reason=env.win_reason if done else None,\n    )\n\n\nclass LiveSession:\n    def __init__(self, seed=0, max_turns=150):\n        self.env = WesterosEnv(seed=seed, max_turns=max_turns)\n        self.obs = self.env.reset()\n        self.agents = {f: default_agent(f, seed) for f in self.env.faction_ids}\n        self.done = False\n\n    def first(self):\n        return json.dumps(frame(self.env, self.env.snapshots[0]))\n\n    def step(self):\n        if self.done:\n            return json.dumps(None)\n        acts = {f: self.agents[f].act(o) for f, o in self.obs.items()}\n        self.obs, _, self.done, _ = self.env.step(acts)\n        return json.dumps(frame(self.env, self.env.snapshots[-1], self.done))\n\n\ndef record(seed=0, max_turns=150):\n    s = LiveSession(seed, max_turns)\n    frames = [json.loads(s.first())]\n    while not s.done:\n        frames.append(json.loads(s.step()))\n    return frames\n","westeros/metrics.py":"\"\"\"Interaction metrics computed from an event log + snapshots.\"\"\"\nfrom collections import Counter, defaultdict\n\n\ndef gini(values):\n    v = sorted(max(0.0, x) for x in values)\n    n, s = len(v), sum(v)\n    if n == 0 or s == 0:\n        return 0.0\n    cum = sum((i + 1) * x for i, x in enumerate(v))\n    return round((2 * cum) / (n * s) - (n + 1) / n, 3)\n\n\ndef summarize(events, snapshots, winner=None, reason=None):\n    c = Counter(e[\"type\"] for e in events)\n    battles = [e for e in events if e[\"type\"] == \"battle\"]\n    broken = [e for e in events if e[\"type\"] == \"alliance_broken\"]\n    proposals = Counter(e[\"kind\"] for e in events if e[\"type\"] == \"proposal\")\n    accepted = Counter(e[\"kind\"] for e in events if e[\"type\"] == \"accepted\")\n    war_pairs = Counter(tuple(sorted((e[\"attacker\"], e[\"defender\"]))) for e in battles if e[\"defender\"] != \"neutral\")\n    aggressor = Counter(e[\"attacker\"] for e in battles)\n    conquests = Counter(e[\"attacker\"] for e in battles if e[\"conquered\"])\n    last = snapshots[-1][\"factions\"]\n    per_faction = {}\n    for f, s in last.items():\n        per_faction[f] = dict(\n            alive=s[\"alive\"], power=s[\"power\"], regions=s[\"regions\"], troops=s[\"troops\"], gold=s[\"gold\"],\n            battles_started=aggressor.get(f, 0), conquests=conquests.get(f, 0),\n            betrayals=sum(1 for e in events if e[\"type\"] in (\"betrayal\", \"red_wedding\") and e[\"by\"] == f),\n            alliances=sum(1 for e in events if e[\"type\"] == \"alliance_formed\" and f in (e[\"a\"], e[\"b\"])),\n            trades=sum(1 for e in events if e[\"type\"] == \"trade\" and f in (e[\"a\"], e[\"b\"])),\n            raids=sum(1 for e in events if e[\"type\"] == \"raid\" and e[\"by\"] == f),\n            loans=sum(1 for e in events if e[\"type\"] == \"loan\" and e[\"borrower\"] == f),\n            defaults=sum(1 for e in events if e[\"type\"] == \"default\" and e[\"borrower\"] == f),\n        )\n    # cooperation index: share of social interactions that were cooperative\n    coop = c[\"alliance_formed\"] + c[\"trade\"] + c[\"loan\"] + c[\"sellswords_hired\"] + c[\"funding\"]\n    conflict = c[\"battle\"] + c[\"raid\"] + c[\"betrayal\"] + c[\"red_wedding\"] + c[\"alliance_broken\"]\n    throne = []\n    prev = None\n    for s in snapshots:\n        h = s[\"owner\"][\"crownlands\"]\n        if h != prev:\n            throne.append(dict(turn=s[\"turn\"], holder=h)); prev = h\n    return dict(\n        winner=winner, reason=reason, turns=snapshots[-1][\"turn\"],\n        counts=dict(c), proposals_by_kind=dict(proposals), accepted_by_kind=dict(accepted),\n        acceptance_rate={k: round(accepted.get(k, 0) / v, 2) for k, v in proposals.items()},\n        battles=len(battles), betrayals=c[\"betrayal\"] + c[\"red_wedding\"], red_weddings=c[\"red_wedding\"],\n        alliances_broken=len(broken),\n        mean_alliance_duration=round(sum(e[\"duration\"] for e in broken) / len(broken), 1) if broken else None,\n        cooperation_index=round(coop / max(1, coop + conflict), 3),\n        bloodiest_rivalries=[dict(pair=list(p), battles=n) for p, n in war_pairs.most_common(5)],\n        power_gini_start=gini([s[\"power\"] for s in snapshots[0][\"factions\"].values()]),\n        power_gini_end=gini([s[\"power\"] for s in last.values()]),\n        survivors=[f for f, s in last.items() if s[\"alive\"]],\n        throne_history=throne,\n        factions=per_faction,\n    )\n\n\ndef timeseries(snapshots, key=\"power\"):\n    out = defaultdict(list)\n    for s in snapshots:\n        for f, v in s[\"factions\"].items():\n            out[f].append(v[key])\n    return dict(out)\n","westeros/world.py":"\"\"\"Static world definition for the Westeros sandbox: regions, map edges, factions, lore relations.\n\nUnits: region `food`/`gold` are per-turn yields (multiplied by INCOME_SCALE in the engine),\n`levy` is the max troops recruitable there per turn, `defense` multiplies defender strength.\n\"\"\"\n\nINCOME_SCALE = 10\n\nREGIONS = {\n    \"lands_of_always_winter\": dict(name=\"Lands of Always Winter\", seat=\"Heart of Winter\", x=400, y=35,  food=0, gold=0,  levy=0,   defense=1.0, coastal=False),\n    \"haunted_forest\":         dict(name=\"Haunted Forest\",         seat=\"Hardhome\",        x=490, y=100, food=3, gold=0,  levy=150, defense=1.0, coastal=True),\n    \"the_wall\":               dict(name=\"The Wall\",               seat=\"Castle Black\",    x=440, y=165, food=3, gold=0,  levy=60,  defense=2.6, coastal=False),\n    \"the_north\":              dict(name=\"The North\",              seat=\"Winterfell\",      x=390, y=265, food=4, gold=2,  levy=400, defense=1.4, coastal=True),\n    \"the_vale\":               dict(name=\"The Vale\",               seat=\"The Eyrie\",       x=580, y=375, food=3, gold=3,  levy=250, defense=2.2, coastal=True),\n    \"riverlands\":             dict(name=\"The Riverlands\",         seat=\"Riverrun\",        x=430, y=400, food=5, gold=3,  levy=350, defense=1.3, coastal=True),\n    \"iron_islands\":           dict(name=\"The Iron Islands\",       seat=\"Pyke\",            x=240, y=365, food=1, gold=1,  levy=200, defense=1.6, coastal=True),\n    \"westerlands\":            dict(name=\"The Westerlands\",        seat=\"Casterly Rock\",   x=290, y=475, food=3, gold=8,  levy=300, defense=1.6, coastal=True),\n    \"crownlands\":             dict(name=\"The Crownlands\",         seat=\"King's Landing\",  x=540, y=505, food=3, gold=6,  levy=300, defense=1.3, coastal=True, throne=True),\n    \"dragonstone\":            dict(name=\"Dragonstone\",            seat=\"Dragonstone\",     x=650, y=455, food=1, gold=1,  levy=50,  defense=1.8, coastal=True),\n    \"the_reach\":              dict(name=\"The Reach\",              seat=\"Highgarden\",      x=340, y=615, food=7, gold=5,  levy=450, defense=1.2, coastal=True),\n    \"stormlands\":             dict(name=\"The Stormlands\",         seat=\"Storm's End\",     x=570, y=615, food=3, gold=2,  levy=300, defense=1.7, coastal=True),\n    \"dorne\":                  dict(name=\"Dorne\",                  seat=\"Sunspear\",        x=480, y=745, food=2, gold=3,  levy=250, defense=1.5, coastal=True),\n    \"braavos\":                dict(name=\"Braavos\",                seat=\"The Iron Bank\",   x=800, y=255, food=3, gold=10, levy=50,  defense=3.0, coastal=True),\n    \"free_cities\":            dict(name=\"The Free Cities\",        seat=\"Pentos\",          x=810, y=470, food=3, gold=5,  levy=200, defense=1.5, coastal=True),\n    \"dothraki_sea\":           dict(name=\"The Dothraki Sea\",       seat=\"Vaes Dothrak\",    x=950, y=400, food=3, gold=0,  levy=500, defense=1.0, coastal=False),\n    \"slavers_bay\":            dict(name=\"Slaver's Bay\",           seat=\"Meereen\",         x=940, y=640, food=3, gold=4,  levy=300, defense=1.4, coastal=True),\n}\n\nLAND_EDGES = [\n    (\"lands_of_always_winter\", \"haunted_forest\"), (\"haunted_forest\", \"the_wall\"), (\"the_wall\", \"the_north\"),\n    (\"the_north\", \"riverlands\"), (\"riverlands\", \"the_vale\"), (\"riverlands\", \"westerlands\"),\n    (\"riverlands\", \"crownlands\"), (\"riverlands\", \"the_reach\"), (\"westerlands\", \"the_reach\"),\n    (\"the_reach\", \"crownlands\"), (\"the_reach\", \"stormlands\"), (\"the_reach\", \"dorne\"),\n    (\"crownlands\", \"stormlands\"), (\"stormlands\", \"dorne\"), (\"the_vale\", \"crownlands\"),\n    (\"braavos\", \"free_cities\"), (\"free_cities\", \"dothraki_sea\"), (\"dothraki_sea\", \"slavers_bay\"),\n    (\"free_cities\", \"slavers_bay\"),\n]\nSEA_EDGES = [\n    (\"iron_islands\", \"the_north\"), (\"iron_islands\", \"riverlands\"), (\"iron_islands\", \"westerlands\"),\n    (\"iron_islands\", \"the_reach\"), (\"crownlands\", \"dragonstone\"), (\"dragonstone\", \"stormlands\"),\n    (\"dragonstone\", \"free_cities\"), (\"the_vale\", \"braavos\"), (\"the_north\", \"braavos\"),\n    (\"the_vale\", \"the_north\"), (\"crownlands\", \"free_cities\"), (\"dorne\", \"free_cities\"),\n    (\"dorne\", \"slavers_bay\"), (\"haunted_forest\", \"the_north\"),\n]\n\n# kind: house | order (Night's Watch) | tribe | undead | horde | bank | sellsword\nFACTIONS = {\n    \"stark\":          dict(name=\"House Stark\",      motto=\"Winter is Coming\",               kind=\"house\",     color=\"#8395a7\", regions=[\"the_north\"],                troops=2000, gold=60,   food=160, ships=5,  dragons=0, traits=dict(aggression=0.35, honor=0.95, greed=0.2, loyalty=0.9)),\n    \"lannister\":      dict(name=\"House Lannister\",  motto=\"A Lannister always pays his debts\", kind=\"house\",  color=\"#c0392b\", regions=[\"westerlands\"],              troops=2500, gold=320,  food=100, ships=10, dragons=0, traits=dict(aggression=0.6,  honor=0.3,  greed=0.85, loyalty=0.5)),\n    \"baratheon\":      dict(name=\"House Baratheon\",  motto=\"Ours is the Fury\",               kind=\"house\",     color=\"#f1c40f\", regions=[\"crownlands\", \"stormlands\"], troops=3000, gold=80,   food=120, ships=15, dragons=0, traits=dict(aggression=0.7,  honor=0.6,  greed=0.4,  loyalty=0.6)),\n    \"targaryen\":      dict(name=\"House Targaryen\",  motto=\"Fire and Blood\",                 kind=\"house\",     color=\"#8e44ad\", regions=[\"slavers_bay\"],              troops=1200, gold=100,  food=90,  ships=20, dragons=3, traits=dict(aggression=0.7,  honor=0.6,  greed=0.5,  loyalty=0.65)),\n    \"tyrell\":         dict(name=\"House Tyrell\",     motto=\"Growing Strong\",                 kind=\"house\",     color=\"#27ae60\", regions=[\"the_reach\"],                troops=2500, gold=200,  food=320, ships=10, dragons=0, traits=dict(aggression=0.3,  honor=0.5,  greed=0.6,  loyalty=0.5)),\n    \"greyjoy\":        dict(name=\"House Greyjoy\",    motto=\"We Do Not Sow\",                  kind=\"house\",     color=\"#16a3b8\", regions=[\"iron_islands\"],             troops=1500, gold=50,   food=60,  ships=60, dragons=0, traits=dict(aggression=0.9,  honor=0.2,  greed=0.7,  loyalty=0.3)),\n    \"martell\":        dict(name=\"House Martell\",    motto=\"Unbowed, Unbent, Unbroken\",      kind=\"house\",     color=\"#e67e22\", regions=[\"dorne\"],                    troops=1800, gold=120,  food=90,  ships=10, dragons=0, traits=dict(aggression=0.35, honor=0.6,  greed=0.4,  loyalty=0.6)),\n    \"arryn\":          dict(name=\"House Arryn\",      motto=\"As High as Honor\",               kind=\"house\",     color=\"#4a69bd\", regions=[\"the_vale\"],                 troops=1800, gold=120,  food=120, ships=10, dragons=0, traits=dict(aggression=0.2,  honor=0.8,  greed=0.3,  loyalty=0.6)),\n    \"tully\":          dict(name=\"House Tully\",      motto=\"Family, Duty, Honor\",            kind=\"house\",     color=\"#2e86de\", regions=[\"riverlands\"],               troops=1800, gold=80,   food=170, ships=0,  dragons=0, traits=dict(aggression=0.3,  honor=0.85, greed=0.3,  loyalty=0.9)),\n    \"nights_watch\":   dict(name=\"The Night's Watch\", motto=\"I am the sword in the darkness\", kind=\"order\",    color=\"#222222\", regions=[\"the_wall\"],                 troops=900,  gold=10,   food=80,  ships=2,  dragons=0, traits=dict(aggression=0.1,  honor=0.9,  greed=0.0,  loyalty=0.8)),\n    \"free_folk\":      dict(name=\"The Free Folk\",    motto=\"We bow to no king\",              kind=\"tribe\",     color=\"#8d6e63\", regions=[\"haunted_forest\"],           troops=2500, gold=0,    food=60,  ships=0,  dragons=0, traits=dict(aggression=0.6,  honor=0.5,  greed=0.5,  loyalty=0.6)),\n    \"white_walkers\":  dict(name=\"The White Walkers\", motto=\"(silence)\",                     kind=\"undead\",    color=\"#74b9ff\", regions=[\"lands_of_always_winter\"],   troops=1200, gold=0,    food=0,   ships=0,  dragons=0, traits=dict(aggression=1.0,  honor=0.0,  greed=0.0,  loyalty=1.0)),\n    \"dothraki\":       dict(name=\"The Dothraki\",     motto=\"It is known\",                    kind=\"horde\",     color=\"#a0522d\", regions=[\"dothraki_sea\"],             troops=4000, gold=0,    food=100, ships=0,  dragons=0, traits=dict(aggression=0.85, honor=0.5,  greed=0.6,  loyalty=0.75)),\n    \"iron_bank\":      dict(name=\"The Iron Bank of Braavos\", motto=\"The Iron Bank will have its due\", kind=\"bank\", color=\"#57606f\", regions=[\"braavos\"],          troops=1200,  gold=1200, food=100, ships=20, dragons=0, traits=dict(aggression=0.0,  honor=0.7,  greed=0.9,  loyalty=0.5)),\n    \"golden_company\": dict(name=\"The Golden Company\", motto=\"Beneath the gold, the bitter steel\", kind=\"sellsword\", color=\"#b7950b\", regions=[\"free_cities\"], troops=2200, gold=60, food=90, ships=10, dragons=0, traits=dict(aggression=0.4, honor=0.4, greed=0.95, loyalty=0.3)),\n}\n\n# Special abilities applied by the engine (kept here so they are easy to read/tweak).\nSPECIALS = {\n    \"stark\":          \"Winter-hardened: food upkeep halved in winter.\",\n    \"lannister\":      \"Gold of Casterly Rock: +50% gold income.\",\n    \"baratheon\":      \"Ours is the Fury: +20% combat strength.\",\n    \"targaryen\":      \"Dragons: fight one b
